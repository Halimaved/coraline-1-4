<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coraline: the Book Club Quest (Chapters 1–4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --stitch: #f2c21a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: 'Lora', Georgia, 'Times New Roman', serif;
    font-size: 18px; line-height: 1.6;
    color: var(--fg);
    background: var(--bg);
    background-attachment: fixed;
    transition: color .6s;
  }
  body.real  { --fg:#f6f0e0; --bg: linear-gradient(180deg,#86a3a8 0%,#46606a 55%,#2b3e46 100%); --panel:rgba(20,32,38,.55); --accent:#f2c21a; --good:#8ff0cf; --bad:#ffa08f; --line:#f2c21a; }
  body.other { --fg:#fff0df; --bg: radial-gradient(ellipse at 50% -10%,#5a2a96 0%,#26104a 50%,#0f0724 100%); --panel:rgba(18,6,44,.6); --accent:#ff9a3d; --good:#3de6cf; --bad:#ff7096; --line:#ff9a3d; }

  .wrap { max-width: 780px; margin: 0 auto; padding: 22px 16px 60px; }
  h1, h2, h3 { font-family: 'Fondamento', 'Lora', cursive; font-weight: 400; margin: 0; }

  /* ---------- Title screen ---------- */
  #title { text-align: center; padding-top: 4vh; }
  #title h1 { font-size: clamp(56px, 13vw, 110px); line-height: 1; letter-spacing: .02em; color: #f2c21a; text-shadow: 3px 4px 0 #1d2a5c, 0 0 28px #2f6fd666; transform: rotate(-2deg); }
  #title .sub { font-family: 'Fondamento', cursive; font-size: clamp(20px, 4.5vw, 28px); margin: 14px 0 6px; }
  #title p { max-width: 520px; margin: 10px auto; opacity: .92; }
  .door-art { width: 190px; margin: 6px auto 0; display: block; }
  .door-glow { animation: glow 3.2s steps(8) infinite alternate; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }

  .go {
    font-family: 'Fondamento', cursive; font-size: 24px; color: #1a1408;
    background: var(--accent, #f2c21a);
    border: 3px dashed #1a1408; outline: 4px solid var(--accent, #f2c21a); outline-offset: 0;
    padding: 12px 30px; margin-top: 22px; border-radius: 40px; cursor: pointer;
    transition: transform .15s;
  }
  .go:hover { transform: rotate(-2deg) scale(1.04); }
  .go:focus-visible, .opt:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }


  #snd {
    position: fixed; top: 10px; right: 10px; z-index: 20;
    font-family: 'Fondamento', 'Lora', cursive; font-size: 16px; color: var(--fg);
    background: var(--panel); border: 2px dashed var(--line); border-radius: 22px;
    padding: 6px 14px; cursor: pointer;
  }
  #snd:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  /* ---------- Progress buttons ---------- */
  #dots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 6px 0 14px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--fg); display: grid; place-items: center; font-size: 14px; font-weight: 600; opacity: .55; position: relative; transition: all .3s; }
  .dot::before, .dot::after { content: ""; position: absolute; width: 3px; height: 3px; background: currentColor; border-radius: 50%; top: 9px; }
  .dot::before { left: 8px; } .dot::after { right: 8px; }
  .dot.now { opacity: 1; border-color: var(--accent); box-shadow: 0 0 12px var(--accent); transform: scale(1.15); }
  .dot.ok  { opacity: 1; background: var(--good); border-color: var(--good); color: #0b2b25; }
  .dot.no  { opacity: 1; background: var(--bad);  border-color: var(--bad);  color: #3b0d14; }
  .dot.ok::before, .dot.ok::after, .dot.no::before, .dot.no::after { display: none; }

  /* ---------- Scene ---------- */
  .stage { animation: fadein .5s ease both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .frame {
    border: 4px dashed var(--line); border-radius: 18px; padding: 8px;
    background: var(--panel); position: relative; overflow: hidden;
    box-shadow: 0 10px 30px #0006;
  }
  .frame svg { display: block; width: 100%; height: auto; border-radius: 10px; }
  .place { font-family: 'Fondamento', cursive; font-size: 22px; margin: 16px 2px 4px; color: var(--accent); }
  .narr { margin: 0 2px 14px; }
  .question { font-family: 'Fondamento', cursive; font-size: 26px; line-height: 1.25; margin: 6px 2px 14px; }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .opts { grid-template-columns: 1fr; } }
  .opt {
    text-align: left; font: inherit; color: var(--fg); cursor: pointer;
    background: var(--panel); border: 3px dashed var(--line); border-radius: 16px;
    padding: 16px 16px 16px 62px; position: relative; min-height: 96px;
    transition: transform .15s, background .2s, border-color .2s;
  }
  .opt:hover:not(:disabled) { transform: rotate(-1deg) translateY(-2px); background: #ffffff1c; }
  .opt .sew { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; background: #111; border: 3px solid #555; }
  .opt .sew::before, .opt .sew::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #777; top: 11px; }
  .opt .sew::before { left: 8px; } .opt .sew::after { right: 8px; }
  .opt:disabled { cursor: default; }
  .opt.correct { border-style: solid; border-color: var(--good); background: color-mix(in srgb, var(--good) 22%, transparent); }
  .opt.wrong   { border-style: solid; border-color: var(--bad);  background: color-mix(in srgb, var(--bad) 18%, transparent); animation: shake .4s; }
  .opt.faded { opacity: .55; }
  @keyframes shake { 25% { transform: translateX(-6px) rotate(-1deg); } 75% { transform: translateX(6px) rotate(1deg); } }

  .reveal { margin-top: 18px; padding: 16px 18px; border-radius: 16px; border-left: 8px solid var(--good); background: var(--panel); animation: fadein .4s ease both; }
  .reveal.bad { border-left-color: var(--bad); }
  .reveal h3 { font-size: 26px; margin-bottom: 4px; }
  .reveal.good h3 { color: var(--good); } .reveal.bad h3 { color: var(--bad); }
  .reveal p { margin: 4px 0 0; }
  .reveal .go { font-size: 20px; padding: 9px 24px; margin-top: 14px; }

  /* ---------- End ---------- */
  #end { text-align: center; }
  #end h2 { font-size: clamp(38px, 9vw, 64px); color: var(--accent); line-height: 1.1; margin: 12px 0; }
  .score { display: flex; justify-content: center; gap: 18px; margin: 20px 0; flex-wrap: wrap; }
  .score div { min-width: 150px; padding: 14px 20px; border-radius: 18px; background: var(--panel); border: 3px dashed var(--line); }
  .score b { display: block; font-family: 'Fondamento', cursive; font-size: 56px; line-height: 1; font-weight: 400; }
  .score .g b { color: var(--good); } .score .r b { color: var(--bad); }
  #missed { max-width: 560px; margin: 16px auto; text-align: left; }
  #missed h3 { font-size: 24px; margin-bottom: 6px; }
  #missed ul { margin: 0; padding-left: 22px; }

  /* ---------- SVG bits ---------- */
  .rain line { stroke: #dff2f7; stroke-width: 1.4; opacity: .5; animation: fall .7s linear infinite; }
  @keyframes fall { from { transform: translateY(-30px); } to { transform: translateY(240px); } }
  .tw { animation: tw 2.4s steps(3) infinite; }
  .tw:nth-child(2n) { animation-delay: .7s; } .tw:nth-child(3n) { animation-delay: 1.4s; }
  @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  .steam { animation: steam 2.4s steps(6) infinite; }
  @keyframes steam { from { transform: translateY(0); opacity: .8; } to { transform: translateY(-16px); opacity: 0; } }
  .bob { animation: bob 2.6s steps(4) infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="real">

<!-- hand-made "boiling" wobble, a nod to stop-motion -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2"/>
    <feDisplacementMap in="SourceGraphic" scale="3.2"/>
  </filter>
</svg>

<button id="snd" type="button" aria-pressed="false">♪ Music off</button>

<div class="wrap">
  <main id="app"></main>
</div>

<script>
/* ==========================================================
   THE QUESTIONS — edit freely.
   The first option is ALWAYS the correct one; the game
   shuffles the order on screen for each player.
   ========================================================== */
const SCENES = [
  {
    world: 'real', art: 'names', place: 'The old pink house',
    narr: "Coraline and her parents have just moved into a flat in an enormous, very old house. She keeps bumping into the neighbours: two retired actresses downstairs and an old man with a moustache upstairs. They all greet her the same way.",
    q: "What do the neighbours keep calling her?",
    opts: ["Caroline", "Cora"],
    truth: "All three neighbours get her name wrong and call her Caroline. Coraline has to correct them every time."
  },
  {
    world: 'real', art: 'well', place: 'The overgrown garden',
    narr: "Beyond the garden lies an old well, covered with wooden planks. Everyone has told Coraline to keep away from it, and of course she is curious.",
    q: "What does Coraline do at the well?",
    opts: ["Drops pebbles through a knothole in the planks and listens for the splash far below", "Lowers a bucket on a rope and pulls up something strange"],
    truth: "She drops pebbles through a knothole in the planks and listens for the splash. It takes a long time, because the well is very deep."
  },
  {
    world: 'real', art: 'parents', place: 'The flat, a rainy day',
    narr: "It is pouring, so Coraline cannot explore outside. The television is boring. She wanders the flat looking for someone to spend time with. Both of her parents are at home.",
    q: "What are her parents doing?",
    opts: ["Working, each in their own study, too busy to play with her", "Baking together in the kitchen and inviting her to help"],
    truth: "Both parents work from home and each has their own study. They are far too busy for her, so Coraline is left to find something to do by herself."
  },
  {
    world: 'real', art: 'count', place: 'Every room in the flat',
    narr: "Left to her own devices, Coraline decides to explore the flat and count everything she can find.",
    q: "What does her count come to?",
    opts: ["21 windows and 14 doors", "14 windows and 21 doors"],
    truth: "She counts 21 windows and 14 doors. Thirteen of the doors open and close as they should. The fourteenth is locked."
  },
  {
    world: 'real', art: 'brick', place: 'The drawing room',
    narr: "The locked door is in the drawing room. Coraline asks her mother where it leads, and her mother finds the key and unlocks it, just to show her.",
    q: "What is on the other side?",
    opts: ["A solid wall of bricks", "A dark, empty corridor"],
    truth: "The door has been bricked up. There is nothing behind it but a wall, and Coraline's mother finds the whole thing rather dull."
  },
  {
    world: 'real', art: 'dinner', place: 'The kitchen, dinnertime',
    narr: "That evening, Coraline's father serves up one of his fancy home-made \"recipes\", as he does most nights.",
    q: "How does Coraline react to dinner?",
    opts: ["She refuses to try it and heats up a microwave pizza instead", "She eats every bite and asks for seconds"],
    truth: "She turns up her nose at her father's latest recipe and has a microwave pizza. Her father's cooking is famously experimental."
  },
  {
    world: 'real', art: 'mice', place: 'The yard, in the fog',
    narr: "The rain has stopped, but a thick white fog has settled over the house. Coraline wanders out into it and bumps into the old man from upstairs. He says his mice have a message for her, and he still believes her name is Caroline.",
    q: "What is odd about the mice's message?",
    opts: ["The mice call her Coraline, her real name, and warn her not to go through the door", "The mice call her Caroline too, and warn her to stay away from the well"],
    truth: "The message is: don't go through the door. Oddly, the mice use her correct name, Coraline, even though the old man passing it on still thinks she is Caroline."
  },
  {
    world: 'real', art: 'tea', place: 'Miss Spink and Miss Forcible\u2019s flat',
    narr: "On a foggy day Coraline visits the old actresses downstairs. Over tea, Miss Spink offers to read her tea leaves.",
    q: "What does Miss Spink see, and what does she give Coraline?",
    opts: ["Terrible danger ahead, and a small stone with a hole in it to carry as a charm", "A fortune on the way, and a little silver key"],
    truth: "Miss Spink sees that Coraline is in danger. She gives her a stone with a hole through it to keep as a talisman."
  },
  {
    world: 'real', art: 'shop', place: 'The department store in town',
    narr: "The next day is sunny, and Coraline's mother takes her to the nearest big town to buy clothes for the new school year. In the shop, Coraline spots something she simply has to have.",
    q: "What does Coraline beg for, and how does her mother respond?",
    opts: ["Day-Glo green gloves; her mother ignores her and buys plain grey and navy school clothes", "Day-Glo green gloves; her mother buys them as a treat for being patient"],
    truth: "Coraline argues that nobody else at school has green gloves, so she would stand out. Her mother ignores her, keeps talking to the shop assistant, and buys grey blouses, a dark grey skirt, navy underpants and white socks."
  },
  {
    world: 'other', art: 'tunnel', place: 'Through the door',
    narr: "Her mother has gone out for groceries. Home alone, Coraline unlocks the door again, and this time the bricks are gone. She crosses a long dark passage and steps into a flat that looks just like her own.",
    q: "Who is waiting for her there?",
    opts: ["A woman who calls herself Coraline\u2019s other mother, with black buttons for eyes", "Her real mother, who followed her in and is furious"],
    truth: "Her \"other mother\" is waiting, and she has black buttons where her eyes should be. She sends Coraline to fetch the other father, who has button eyes too."
  },
  {
    world: 'other', art: 'rats', place: 'Coraline\u2019s other bedroom',
    narr: "After a wonderful meal, the other parents send Coraline off to play in her other bedroom. Something is not right there.",
    q: "What does she find under the bed?",
    opts: ["A pack of rats that sing her an eerie song", "A tiny circus of performing mice"],
    truth: "Rats live under the bed in the other world, and they sing her an ominous song. The mouse circus belongs to the old man upstairs, back in the real world."
  },
  {
    world: 'other', art: 'collector', place: 'Coraline\u2019s other bedroom, a little later',
    narr: "Coraline is still in her other bedroom, watching the rats, when they suddenly scramble away in a panic. Someone has appeared in the doorway to collect them.",
    q: "Who comes for the rats?",
    opts: ["The other crazy old man from upstairs, who invites her up to see his flat", "The other father, who tells her it is time for dessert"],
    truth: "It is the other version of the old man from upstairs. The rats swarm up his clothes and he invites Coraline to come up, but she feels uneasy and says no."
  },
  {
    world: 'other', art: 'wall', place: 'The garden wall',
    narr: "Coraline slips outside into the garden of the other world. She hears something behind her and turns around: the black cat from home is sitting on the garden wall. She assumes it must be the \"other\" cat.",
    q: "What does the cat tell her?",
    opts: ["It is the very same cat from home, because cats keep themselves together, unlike people", "It is the other world's copy, made by the other mother to keep an eye on her"],
    truth: "The cat insists that it is the same cat from her own home. Unlike people, it says, cats keep themselves together, so there is no \"other\" version of a cat. It can talk here, too."
  },
  {
    world: 'other', art: 'cat', place: 'The garden, after dark',
    narr: "Coraline keeps asking questions: where is she, what is she doing here, and who are her other parents really?",
    q: "How does the cat answer?",
    opts: ["It gives no real answers and darts off into the woods", "It explains everything, then leads her home"],
    truth: "The cat stays vague, gives her no real answers and bolts into the woods. Coraline decides to go and see the other Miss Spink and Miss Forcible."
  },
  {
    world: 'other', art: 'theater', place: 'The downstairs flat, the other side',
    narr: "Coraline walks into the flat where the real Miss Spink and Miss Forcible live. It has been completely transformed.",
    q: "What is going on inside?",
    opts: ["A huge theatre where the two women look young and glamorous and perform for an audience of dogs", "A huge theatre where the two women look young and glamorous and perform for an audience of rats"],
    truth: "The flat has become a cavernous theatre. The other Miss Spink and Miss Forcible perform scenes on stage for an audience of dogs, who applaud."
  }
];

/* ==========================================================
   ILLUSTRATIONS (original SVG, hand-drawn look)
   ========================================================== */
const DEFS = `<defs>
  <linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c0c4"/><stop offset="1" stop-color="#5f7d84"/></linearGradient>
  <linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d95a0"/><stop offset="1" stop-color="#3c4f58"/></linearGradient>
  <linearGradient id="gN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d1056"/><stop offset="1" stop-color="#0d0522"/></linearGradient>
  <linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2a8f"/><stop offset="1" stop-color="#1c0b3a"/></linearGradient>
</defs>`;

const mouthDefault = 'M-4 13 Q0 16 4 13';
const mouthFlat = 'M-4 14 L4 14';

const cor = (x, feet, s = 1, mouth = mouthDefault) => {
  const y = feet - 92 * s;
  return `<g transform="translate(${x} ${y}) scale(${s})">
  <ellipse cx="0" cy="92" rx="24" ry="4" fill="#0005"/>
  <rect x="-10" y="62" width="7" height="26" fill="#e9cfb8"/><rect x="3" y="62" width="7" height="26" fill="#e9cfb8"/>
  <rect x="-14" y="83" width="13" height="9" rx="3" fill="#26263f"/><rect x="1" y="83" width="13" height="9" rx="3" fill="#26263f"/>
  <path d="M-22 66 L-14 26 Q0 20 14 26 L22 66 Z" fill="#f2c21a"/>
  <path d="M-14 26 Q0 34 14 26" stroke="#b98d08" stroke-width="2" fill="none"/>
  <path d="M-20 34 Q-30 50 -24 62" stroke="#f2c21a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M20 34 Q30 50 24 62" stroke="#f2c21a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <rect x="-4" y="18" width="8" height="10" fill="#f3d9c3"/>
  <circle cx="0" cy="4" r="17" fill="#f6dfca"/>

  <path d="M-19 2 Q-23 18 -15 24 Q-14 12 -16 2Z" fill="#2f6fd6"/><path d="M19 2 Q23 18 15 24 Q14 12 16 2Z" fill="#2f6fd6"/>
  <circle cx="-6" cy="6" r="2.2" fill="#1b1b2b"/><circle cx="6" cy="6" r="2.2" fill="#1b1b2b"/>
  <path d="${mouth}" stroke="#a24a4a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>`;
};

const lady = (x, feet, c, hair = '#d8d8dc') => `<g transform="translate(${x} ${feet})">
  <ellipse cx="0" cy="2" rx="26" ry="4" fill="#0004"/>
  <ellipse cx="0" cy="-30" rx="25" ry="30" fill="${c}"/>
  <circle cx="0" cy="-70" r="14" fill="#f1d3bd"/>
  <path d="M-15 -72 Q0 -94 15 -72 Q10 -80 0 -80 Q-10 -80 -15 -72Z" fill="${hair}"/>
  <circle cx="-5" cy="-70" r="1.6" fill="#222"/><circle cx="5" cy="-70" r="1.6" fill="#222"/>
  <path d="M-5 -63 Q0 -59 5 -63" stroke="#a24a4a" stroke-width="1.5" fill="none"/>
  <circle cx="0" cy="-38" r="3" fill="#fff8"/>
</g>`;

const mum = (x, feet) => `<g transform="translate(${x} ${feet})">
  <ellipse cx="0" cy="2" rx="22" ry="4" fill="#0004"/>
  <rect x="-8" y="-40" width="6" height="40" fill="#e9cfb8"/><rect x="2" y="-40" width="6" height="40" fill="#e9cfb8"/>
  <path d="M-18 -40 L-12 -95 Q0 -100 12 -95 L18 -40Z" fill="#5b8a6b"/>
  <circle cx="0" cy="-110" r="14" fill="#f3d9c3"/>

</g>`;

const dad = (x, feet) => `<g transform="translate(${x} ${feet})">
  <ellipse cx="0" cy="2" rx="22" ry="4" fill="#0004"/>
  <rect x="-9" y="-40" width="7" height="40" fill="#4a4e6a"/><rect x="2" y="-40" width="7" height="40" fill="#4a4e6a"/>
  <path d="M-19 -40 L-13 -95 Q0 -100 13 -95 L19 -40Z" fill="#8c6a4a"/>
  <path d="M-12 -92 L12 -92 L14 -50 L-14 -50Z" fill="#efe6d2"/>
  <circle cx="0" cy="-110" r="14" fill="#f3d9c3"/>
  <path d="M-10 -122 Q0 -132 10 -122" stroke="#4a3020" stroke-width="4" fill="none"/>
  <circle cx="-5" cy="-110" r="4" fill="none" stroke="#222" stroke-width="1.4"/><circle cx="5" cy="-110" r="4" fill="none" stroke="#222" stroke-width="1.4"/>
  <path d="M-4 -102 Q0 -99 4 -102" stroke="#a24a4a" stroke-width="1.5" fill="none"/>
</g>`;

const rain = (n = 26) => {
  let s = '<g class="rain">';
  for (let i = 0; i < n; i++) {
    const x = (i * 53) % 400, d = ((i * 37) % 70) / 100;
    s += `<line x1="${x}" y1="-20" x2="${x - 6}" y2="0" style="animation-delay:-${d}s"/>`;
  }
  return s + '</g>';
};
const sparks = (n = 16) => {
  let s = '<g>';
  for (let i = 0; i < n; i++) {
    const x = (i * 97 + 20) % 400, y = (i * 61 + 10) % 150, r = 1 + (i % 3) * .7;
    s += `<circle class="tw" cx="${x}" cy="${y}" r="${r}" fill="${i % 2 ? '#ffd27a' : '#6ff2e0'}"/>`;
  }
  return s + '</g>';
};
const bubble = (x, y, w, txt) => `<g><ellipse cx="${x}" cy="${y}" rx="${w}" ry="17" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="${x}" y="${y + 5}" text-anchor="middle" font-family="Fondamento, cursive" font-size="15" fill="#222">${txt}</text></g>`;

const ART = {
  mice: () => `<rect width="400" height="240" fill="#cdd6d4"/>

function artSVG(key) {
  return `<svg viewBox="0 0 400 240" role="img" aria-label="Storybook illustration for this scene">${DEFS}<g filter="url(#wobble)">${ART[key]()}</g></svg>`;
}

/* ==========================================================
   GAME LOGIC
   ========================================================== */
const app = document.getElementById('app');
let i = 0, right = 0, wrong = 0, marks = [], missed = [];

const shuffle = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function showTitle() {
  document.body.className = 'real';
  Sound.setWorld('real');
  app.innerHTML = `<section id="title" class="stage">
    <svg class="door-art" viewBox="0 0 200 250" aria-hidden="true">
      <g filter="url(#wobble)">
        <rect x="20" y="10" width="160" height="220" rx="6" fill="#4a3123" stroke="#22150d" stroke-width="6"/>
        <polygon class="door-glow" points="100,20 170,30 170,215 100,222" fill="#ffd98a"/>
        <polygon points="20,10 100,20 100,222 20,230" fill="#6a4630" stroke="#22150d" stroke-width="5"/>
        <circle cx="86" cy="125" r="11" fill="#0d0d14" stroke="#555" stroke-width="3"/><circle cx="82" cy="121" r="2" fill="#777"/><circle cx="90" cy="121" r="2" fill="#777"/><circle cx="82" cy="129" r="2" fill="#777"/><circle cx="90" cy="129" r="2" fill="#777"/>
      </g></svg>
    <h1>Coraline</h1>
    <div class="sub">The Book Club Quest: Chapters 1 to 4</div>
    <p>Fifteen moments from the story, and the last few are sneaky. At each one, pick what really happened. If you slip, the book sets you straight and the story carries on the right way.</p>
    <p>No peeking at the pages. The Other Mother is watching.</p>
    <button class="go" id="start">Step through the door</button>
  </section>`;
  document.getElementById('start').onclick = () => { Sound.start(); i = 0; right = 0; wrong = 0; marks = []; missed = []; showScene(); };
  document.getElementById('start').focus();
}

function dots() {
  return `<div id="dots" aria-label="Progress">${SCENES.map((_, k) => {
    const c = marks[k] === 1 ? 'ok' : marks[k] === 0 ? 'no' : k === i ? 'now' : '';
    return `<span class="dot ${c}">${marks[k] === 1 ? '\u2713' : marks[k] === 0 ? '\u00d7' : ''}</span>`;
  }).join('')}</div>`;
}

function showScene() {
  const s = SCENES[i];
  document.body.className = s.world;
  Sound.setWorld(s.world);
  const order = shuffle([{ t: s.opts[0], ok: true }, { t: s.opts[1], ok: false }]);
  app.innerHTML = `<section class="stage">
    ${dots()}
    <div class="frame">${artSVG(s.art)}</div>
    <div class="place">${esc(s.place)}</div>
    <p class="narr">${esc(s.narr)}</p>
    <div class="question">${esc(s.q)}</div>
    <div class="opts" role="group" aria-label="Choose an answer">
      ${order.map((o, n) => `<button class="opt" data-n="${n}"><span class="sew"></span>${esc(o.t)}</button>`).join('')}
    </div>
    <div id="out" aria-live="polite"></div>
  </section>`;
  const btns = [...app.querySelectorAll('.opt')];
  btns.forEach((b, n) => b.onclick = () => answer(order, btns, n));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function answer(order, btns, n) {
  const s = SCENES[i], ok = order[n].ok;
  Sound.sfx(ok);
  btns.forEach((b, k) => { b.disabled = true; if (order[k].ok) b.classList.add('correct'); else if (k === n) b.classList.add('wrong'); else b.classList.add('faded'); });
  if (ok) { right++; marks[i] = 1; } else { wrong++; marks[i] = 0; missed.push(s); }
  document.getElementById('dots').outerHTML = dots();
  const last = i === SCENES.length - 1;
  document.getElementById('out').innerHTML = `<div class="reveal ${ok ? 'good' : 'bad'}">
    <h3>${ok ? 'Yes, that is what happened.' : 'Not quite. Here is what really happened:'}</h3>
    <p>${esc(s.truth)}</p>
    <button class="go" id="next">${last ? 'See how you did' : 'Continue the story'}</button>
  </div>`;
  const nx = document.getElementById('next');
  nx.onclick = () => { if (last) showEnd(); else { i++; showScene(); } };
  nx.focus({ preventScroll: true });
  nx.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function showEnd() {
  document.body.className = 'other';
  Sound.setWorld('other');
  const rank =
    right === SCENES.length ? ['Not a single button missed.', 'You read every page. Even the Other Mother could not fool you.'] :
    right >= 12  ? ['A brave explorer.', 'You noticed nearly everything. Just a detail or two slipped past you.'] :
    right >= 7   ? ['Wandering in the fog.', 'You caught the big moments but missed a few corners of the house. A little re-reading will help.'] :
                   ['The Other Mother is pleased.', 'She would love you to keep reading... but perhaps with a bit more attention this time.'];
  app.innerHTML = `<section id="end" class="stage">
    <svg viewBox="0 0 400 140" style="width:min(380px,90%)" aria-hidden="true"><g filter="url(#wobble)">
      ${sparks(10)}${cor(200, 138, 1.1)}
      <g class="bob"><circle cx="110" cy="60" r="14" fill="#0d0d14" stroke="#6ff2e0" stroke-width="3"/><circle cx="104" cy="56" r="2" fill="#6ff2e0"/><circle cx="116" cy="56" r="2" fill="#6ff2e0"/><circle cx="290" cy="60" r="14" fill="#0d0d14" stroke="#ff9a3d" stroke-width="3"/><circle cx="284" cy="56" r="2" fill="#ff9a3d"/><circle cx="296" cy="56" r="2" fill="#ff9a3d"/></g>
    </g></svg>
    <h2>${rank[0]}</h2>
    <p>${rank[1]}</p>
    <div class="score">
      <div class="g"><b>${right}</b>right</div>
      <div class="r"><b>${wrong}</b>wrong</div>
    </div>
    ${missed.length ? `<div id="missed"><h3>Worth another look before the discussion:</h3><ul>${missed.map(m => `<li>${esc(m.place)}</li>`).join('')}</ul></div>` : ''}
    <button class="go" id="again">Go through the door again</button>
  </section>`;
  document.getElementById('again').onclick = showTitle;
  window.scrollTo({ top: 0 });
}


/* ==========================================================
   MUSIC & SOUND (original, generated live with Web Audio)
   Real world: soft rain, a low hum and sparse music-box notes.
   Other world: a warm little waltz on the same music box.
   ========================================================== */
const Sound = (() => {
  let ctx = null, master, bus, noiseG, padG, timer = null, nextT = 0, step = 0;
  let on = false, muted = false, world = 'real';
  try { muted = localStorage.getItem('coraline-muted') === '1'; } catch (e) {}
  const btn = document.getElementById('snd');
  const label = () => {
    const live = on && !muted;
    btn.textContent = live ? '\u266A Music on' : '\u266A Music off';
    btn.setAttribute('aria-pressed', String(live));
  };

  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    bus = ctx.createGain(); bus.connect(master);
    // a little hall reverb made from decaying noise
    const len = Math.floor(ctx.sampleRate * 2.6), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 2.8); }
    const conv = ctx.createConvolver(); conv.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.45;
    bus.connect(conv); conv.connect(wet); wet.connect(master);
    // rain
    const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), nd = nb.getChannelData(0);
    for (let k = 0; k < nd.length; k++) nd[k] = Math.random() * 2 - 1;
    const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.5;
    noiseG = ctx.createGain(); noiseG.gain.value = 0;
    ns.connect(bp); bp.connect(noiseG); noiseG.connect(master); ns.start();
    // low hum
    padG = ctx.createGain(); padG.gain.value = 0; padG.connect(bus);
    [110, 164.81, 220.5].forEach((f, k) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0.05 / (k + 1);
      o.connect(g); g.connect(padG); o.start();
    });
    return true;
  }

  function tone(f, t, v, d) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    g.connect(bus);
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(g);
    o.start(t); o.stop(t + d + 0.05);
  }
  // music-box "tine": a fundamental plus a bright overtone that dies quickly
  function pluck(f, t, v, d) {
    tone(f, t, v, d);
    tone(f * 4.01, t, v * 0.25, d * 0.25);
  }

  const REAL_NOTES = [220, 261.63, 329.63, 392, 440, 523.25];
  const BASS = [110, 87.31, 73.42, 82.41];                       // Am F Dm E
  const MELODY = [
    [440, 523.25, 659.25], [523.25, 698.46, 523.25],
    [587.33, 698.46, 440], [659.25, 415.3, 493.88]
  ];

  function schedule() {
    if (world === 'other') {
      const pos = step % 12, bar = Math.floor(pos / 3), beat = pos % 3, t = nextT + Math.random() * 0.012;
      if (beat === 0) pluck(BASS[bar], t, 0.1, 1.9);
      let f = MELODY[bar][beat];
      if (Math.random() < 0.12) f *= 1.122;                       // a stray, slightly wrong note
      pluck(f, t, 0.07, 1.3);
      nextT += 0.44; step++;
    } else {
      const f = REAL_NOTES[Math.floor(Math.random() * REAL_NOTES.length)];
      pluck(f, nextT, 0.055, 2.6);
      if (Math.random() < 0.35) pluck(f * 1.5, nextT + 0.35, 0.03, 2.2);
      nextT += 1.2 + Math.random() * 1.9;
    }
  }
  function tick() { if (!ctx || !on || muted) return; while (nextT < ctx.currentTime + 0.5) schedule(); }

  function levels() {
    if (!ctx) return;
    const t = ctx.currentTime;
    noiseG.gain.setTargetAtTime(world === 'real' ? 0.03 : 0, t, 0.6);
    padG.gain.setTargetAtTime(world === 'real' ? 0.9 : 0.5, t, 0.8);
  }
  function run() {
    ctx.resume();
    master.gain.setTargetAtTime(0.8, ctx.currentTime, 0.4);
    nextT = ctx.currentTime + 0.15; step = 0;
    clearInterval(timer); timer = setInterval(tick, 120);
    levels();
  }
  function stop() {
    if (!ctx) return;
    master.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
    clearInterval(timer);
  }

  btn.addEventListener('click', () => {
    if (!on) { muted = false; try { localStorage.setItem('coraline-muted', '0'); } catch (e) {} start(true); return; }
    muted = !muted;
    try { localStorage.setItem('coraline-muted', muted ? '1' : '0'); } catch (e) {}
    muted ? stop() : run();
    label();
  });
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else if (on && !muted) ctx.resume();
  });

  function start(force) {
    if (!ctx && !build()) return;
    on = true;
    if (!muted || force) { if (force) muted = false; run(); }
    label();
  }
  return {
    start,
    setWorld(w) { world = w; levels(); },
    sfx(ok) {
      if (!ctx || !on || muted) return;
      const t = ctx.currentTime + 0.02;
      if (ok) { pluck(784, t, 0.14, 1.1); pluck(1174.7, t + 0.12, 0.14, 1.4); pluck(1568, t + 0.24, 0.1, 1.6); }
      else    { pluck(196, t, 0.16, 0.9);  pluck(146.8, t + 0.18, 0.16, 1.3); }
    }
  };
})();
document.getElementById('snd').textContent = '\u266A Music off';

/* stop-motion "boil": re-seed the wobble a few times a second */
const turb = document.getElementById('turb');
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  let seed = 1;
  setInterval(() => { seed = seed % 7 + 1; turb.setAttribute('seed', seed); }, 170);
}

showTitle();
</script>
</body>
